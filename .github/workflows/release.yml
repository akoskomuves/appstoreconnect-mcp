name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` is what npm Trusted Publishing uses to mint a
      # short-lived OIDC credential — no static NPM_TOKEN needed.
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Node 24 (current LTS) ships with npm 11.x, which is required for npm
      # Trusted Publishing OIDC auth on the publish step. Node 22's npm 10.x
      # only supports the provenance signing half of the flow.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build
        run: npm run build

      # When changesets are pending: opens a "Release PR" bumping the version + CHANGELOG.
      # When the Release PR is merged: runs `npm run release` (build + changeset publish),
      # which publishes to npm and creates a GitHub Release per published package.
      # Authentication uses npm Trusted Publishing (OIDC) — configure once at
      # https://www.npmjs.com/package/@akoskomuves/appstoreconnect-mcp/access
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          commit: 'chore: release'
          title: 'chore: release'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
